"<" = "\u0326"  # combining comma below
";" = "\u0328"  # combining ogonek
"\"" = "\u030B"  # combining double acute accent
"(" = "\u0314"  # combining reversed comma above (Greek rough breathing)
")" = "\u0313"  # combining comma above (Greek smooth breathing)
"~" = "\u0303"  # combining tilde
i = "\u0345"  # combining greek ypogegrammeni (iota subscript)
I = "\u0345"  # combining greek ypogegrammeni (iota subscript)
"/" = "\u0338"  # combining long solidus overlay (negation, e.g., ⊂ to ⊄)
_ = "\u0332"  # combining low line
"!" = "\u0323"  # combining dot below

[dead.accent.notes]
"\u0307" = "dot above, e.g., `x⌥;.` gives `ẋ` (time derivative), `z⌥;.` gives `ż`"  # combining dot above
"\u0308" = "diaeresis (umlaut), e.g., `x⌥;:` gives `ẍ`, `e⌥;:` gives `ë`"  # combining diaeresis
"\u0301" = "acute, e.g., `s⌥;'` gives `ś`, `α⌥;'` gives `ά` (Greek tonos or oxia)"  # combining acute accent
"\u0300" = "grave, e.g., ``α⌥;` `` gives `ὰ` (Greek varia)"  # combining grave accent
"\u0302" = "circumflex, e.g., `w⌥;^` gives `ŵ`"  # combining circumflex accent
"\u030C" = "caron (háček), e.g., `c⌥;v` gives `č`"  # combining caron
"\u0304" = "macron (not the overline on `⌥5`), e.g., `a⌥;-` gives `ā`"  # combining macron
"\u030A" = "ring above, e.g., `a⌥;o` gives `å`, `u⌥;o` gives `ů`"  # combining ring above
"\u0306" = "breve, e.g., `g⌥;u` gives `ğ`, `a⌥;u` gives `ă`"  # combining breve
"\u0327" = "cedilla, e.g., `s⌥;,` gives `ş` (Turkish)"  # combining cedilla
"\u0326" = "comma below, e.g., `s⌥;<` gives `ș` (Romanian; not the cedilla)"  # combining comma below
"\u0328" = "ogonek, e.g., `a⌥;;` gives `ą`"  # combining ogonek
"\u030B" = "double acute, e.g., `o⌥;\"` gives `ő` (Hungarian)"  # combining double acute accent
"\u0314" = "rough breathing (dasia), e.g., `α⌥;(` gives `ἁ`"  # combining reversed comma above
"\u0313" = "smooth breathing (psili), e.g., `α⌥;)` gives `ἀ`"  # combining comma above
"\u0303" = "tilde, e.g., `a⌥;~` gives `ã`; the Greek circumflex (perispomeni) is on `⌥f~`"  # combining tilde
"\u0345" = "iota subscript (ypogegrammeni), e.g., `α⌥;i` gives `ᾳ`"  # combining greek ypogegrammeni
"\u0338" = "long solidus overlay (negation), e.g., `⊂⌥;/` gives `⊄`"  # combining long solidus overlay
"\u0332" = "low line (underline), e.g., `v⌥;_` gives `v̲`"  # combining low line
"\u0323" = "dot below, e.g., `h⌥;!` gives `ḥ`"  # combining dot below

