[notes]
"\u0303" = "combining over-tilde for the previous character, e.g., ``S⌥⇧` `` gives `S̃` (Fourier transform)"  # combining tilde
"′" = "prime"
"¡" = "inverted exclamation mark"
"²" = "square"
"√" = "square root"
"³" = "cube"
"∫" = "integral"
"∀" = "for all"
"€" = "euro"
"\u0305" = "combining over-bar for the previous character, e.g., `z⌥5` gives `z̅` (complex conjugate)"  # combining overline
"÷" = "division sign (integer division in Julia)"
"⋅" = "dot operator (inner product)"
"\u0302" = "combining hat for the previous character, e.g., `H⌥⇧6` gives `Ĥ` (operator)"  # combining circumflex accent
"≠" = "not equal"
"≢" = "not identical to"
"∞" = "infinity"
"Å" = "Ångström"
"‘" = "left single quotation mark"
"°" = "degree"
"’" = "right single quotation mark"
"–" = "en-dash"
"—" = "em-dash"
"≈" = "almost equal"
"±" = "plus-minus"
"α" = "Greek alpha"
"⨁" = "circled plus (direct sum)"
"ω" = "Greek omega (angular frequency)"
"∘" = "ring operator (function composition in Julia)"
"∈" = "element of (not to be confused with Greek `ϵ` or `ε`)"
"∉" = "not an element of"
"ρ" = "Greek rho (density matrix)"
"†" = "dagger (Hermitian conjugate)"
"≡" = "identical to"
"Ψ" = "Greek capital Psi (state vector)"
"Φ" = "Greek capital Phi"
"ü" = "umlaut"
"Ü" = "umlaut"
"𝕚" = "double-struck i (imaginary unit)"
"𝟙" = "double-struck 1 (identity operator)"
"ö" = "umlaut"
"Ö" = "umlaut"
"π" = "Greek pi"
"∏" = "product (not to be confused with Greek `Π`)"
"⟨" = "left angle bracket (bra, `⟨Ψ\\|`)"
"“" = "left double quotation mark"
"⟩" = "right angle bracket (ket, `\\|Ψ⟩`)"
"”" = "right double quotation mark"
"≪" = "much less than"
"≫" = "much greater than"
"ä" = "umlaut"
"Ä" = "umlaut"
"ß" = "German sharp s (not to be confused with Greek `β`)"
"∑" = "sum (not to be confused with Greek `Σ`)"
"∂" = "partial derivative"
"Δ" = "Greek capital Delta"
"ğ" = "g with breve (Turkish)"
"Γ" = "Greek capital Gamma"
"ℏ" = "reduced Planck constant"
"ℋ" = "script H (Hilbert space)"
"←" = "left arrow"
"⇐" = "double left arrow"
"→" = "right arrow"
"⇒" = "double right arrow (implies)"
"\u20D7" = "combining over-arrow (vector) for the previous character, e.g., `v⌥l` gives `v⃗`"  # combining right arrow above
"⇔" = "double left-right arrow (logically equivalent)"
"\u0307" = "combining over-dot for the previous character, e.g., `x⌥;` gives `ẋ` (time derivative)"  # combining dot above
"\u0308" = "combining double dot for the previous character, e.g., `x⌥⇧;` gives `ẍ` (second time derivative)"  # combining diaeresis
"″" = "double prime"
"×" = "multiplication sign, e.g., `3×10⁻³`"
"⊗" = "tensor (Kronecker) product"
"ç" = "c with cedilla"
"Ç" = "capital C with cedilla"
"∨" = "logical or"
"∧" = "logical and"
"β" = "Greek beta"
"∇" = "nabla (gradient)"
"ñ" = "n with tilde"
"Ñ" = "capital N with tilde"
"µ" = "micro sign, e.g., `µm`"
"∝" = "proportional to"
"≤" = "less than or equal"
"…" = "ellipsis"
"≥" = "greater than or equal"
"¿" = "inverted question mark"

