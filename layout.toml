# U.S. Scientific keyboard layout
#
# This file is the single source of the layout for all platforms.
#
# Without modifiers and with Shift, every key types what it types on a US
# keyboard. [alternative] lists what keys type with the Option key on macOS,
# or AltGr (right Alt) on Windows and Linux. It and the dead-key maps are
# keyed by the character a key types without that modifier: `q` is the Q
# key, `Q` is Shift+Q, `"1"` is the 1 key and `"!"` is Shift+1. Caps Lock
# acts like Shift for letters, also for alternative letters whose shifted
# alternative is their uppercase form. A dead key followed by Space types the dead key's symbol.
#
# [notes] explains characters (keyed by the character) for the README;
# characters without a note are described by their Unicode name. A dead key
# with `table = true` lists its entries in a table in the README, described
# by its own [dead.<id>.notes] (keyed by the result), [notes], or the
# Unicode name. `readme` is a paragraph (Markdown) for the dead key's section
# of the README, below its diagram. On the cheat sheet, a result after an
# Option key shows the character it is keyed by small and gray behind it, as
# a mnemonic (`⟹` after `⇒`), unless that is a letter or listed in the dead
# key's `no-hint`.
#
# A dead key with `after` instead of `key` is a chained dead key: it is
# typed as two dead keys one after the other (their ids), e.g. Math Bold and
# then Greek. Its map is keyed like the other dead keys'.
#
# [numpad.option] and [numpad.shift-option] are the number pad with Option
# (AltGr) and with Shift+Option (Shift+AltGr), keyed by what the key types
# with Num Lock on (`"7"`, `"+"`). The native Windows layout leaves the number
# pad alone. After a dead key, a number pad key acts like the key of the main
# keyboard that types the same character.

[layout]
name = "U.S. Scientific"
id = "us_scientific"
version = "6.0.0-dev"  # X.Y.Z for a release; between releases, X.Y.Z+dev or X.Y.Z-dev (see CHANGELOG.md)
author = "Michael Goerz"
copyright = "2021-2026"
license = "MIT"
language = "en"
macos-bundle-id = "net.michaelgoerz.keyboardlayout.us-scientific"
macos-id = -18113  # unique negative id of a custom macOS layout
windows-dll = "kbdussci"

