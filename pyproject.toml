[project]
name = "layoutgen"
version = "4.0.0"
description = "Generate the U.S. International - Scientific keyboard layout for macOS, Windows, and Linux from layout.toml"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fonttools>=4.50"]

[project.scripts]
layoutgen = "layoutgen.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layoutgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
